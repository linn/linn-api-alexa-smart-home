AWSTemplateFormatVersion: '2010-09-09'
Description: Alexa Smart Home skill backend - the Lambda the skill invokes, its log group and the permission that lets Alexa call it.

# REPLACES the Serverless Framework deployment. Serverless itself deployed through CloudFormation, so
# there is an existing stack owning the production function - and the Alexa skill is bound to that
# function's ARN, which is account + region + FUNCTION NAME. Change the name and the skill has to be
# repointed in the Alexa developer console.
#
# So the function name below is PINNED to the name Serverless generated (service-stage-functionKey),
# and every logical id is pinned to the one Serverless used, so that deploying this template to the
# EXISTING stack (linn-api-alexa-smart-home-production) updates in place rather than replacing.
# Verified against describe-stack-resources on 2026-08-15.
#
# The AWS::Lambda::Version that Serverless also created is deliberately NOT reproduced here, so the
# update removes it. That is safe: the skill's invoke permission names the UNQUALIFIED function ARN,
# so Alexa calls $LATEST and has never resolved a pinned version.

Parameters:
  environment:
    Type: String
    AllowedValues: [sys, prod]
  stage:
    Type: String
    Description: The stage segment of the function name. 'production' for prod - it is what Serverless used, and the skill is bound to the resulting ARN.
    AllowedValues: [sys, production]
  codeBucket:
    Type: String
  codeKey:
    Type: String
  alexaSkillId:
    Type: String
    Default: amzn1.ask.skill.e94eecfe-71a0-43f1-9785-ed517f984f02
  linnApiRoot:
    Type: String
    Description: The Linn API this skill controls devices through.

Conditions:
  IsInheritedFromServerless: !Equals [!Ref stage, production]
  # Matching every other RnDCost site in the estate: a boolean, false in prod.
  RndCost: !Not [!Equals [!Ref environment, prod]]
  # The silence alarm below is prod-only: sys sees no customer traffic, so absence there is normal.
  IsProduction: !Equals [!Ref environment, prod]

Resources:
  # Logical id kept as Serverless generated it, so this is an in-place update of the existing
  # function rather than a create-and-replace. See the header.
  AlexaSmartHomeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub linn-api-alexa-smart-home-${stage}-alexaSmartHome
      Description: Alexa Smart Home Skill Backend
      Runtime: nodejs22.x
      Handler: dist/Handler.handler
      Timeout: 7
      MemorySize: 128
      Role: !GetAtt IamRoleLambdaExecution.Arn
      Code:
        S3Bucket: !Ref codeBucket
        S3Key: !Ref codeKey
      Environment:
        Variables:
          LINN_API_ROOT: !Ref linnApiRoot

  # Declared rather than left to Lambda to create implicitly. A log group Lambda creates for itself
  # has NO expiry, and this group needs a bound. NOT because it carries the account subject: an earlier
  # version of this comment said so, and this very change removed the subject from every log line. The
  # bound is still right for a different reason - the lines carry device ids, and until the same change
  # they carried customer-authored device friendly names, which are not pseudonymous at all (ADR-034).
  # Seven days is what the Serverless deployment set and is preserved deliberately.
  AlexaSmartHomeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/linn-api-alexa-smart-home-${stage}-alexaSmartHome
      RetentionInDays: 7

  # Logical id and role name both kept as Serverless generated them. That is necessary but was NOT
  # sufficient: an earlier version of this comment claimed the role therefore updates in place, and a
  # change set against the live stack said otherwise - see Path below. Renaming either id or name would
  # replace it too, but the omitted property was the one that actually bit.
  IamRoleLambdaExecution:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub linn-api-alexa-smart-home-${stage}-${AWS::Region}-lambdaRole
      # DECLARED EXPLICITLY, and this line is what stops the production migration failing.
      #
      # `/` is also the default, so omitting it produced the identical role - but CloudFormation diffs
      # TEMPLATE values, not the resolved state. Serverless set Path explicitly; leaving it out here read
      # as a change from "/" to unset, and Path requires recreation. With RoleName pinned to the name the
      # existing role already has, recreation means create-before-delete against an account-unique name:
      # EntityAlreadyExists, and the whole stack update rolls back.
      #
      # Confirmed against the live stack rather than reasoned about: a change set on
      # linn-api-alexa-smart-home-production reported `Path` with RequiresRecreation: Always, and
      # `aws iam get-role` reports the deployed Path as "/". Every other resource in that change set is
      # a non-replacing Modify.
      Path: /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Writing its own logs is the only thing this function does besides call the Linn API over
        # the public internet. It reaches no AWS resource, so it is granted no other access.
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Written out rather than using !GetAtt on the log group. Both stream actions are
                # authorised against the LOG STREAM arn, so the resource has to end in the stream
                # wildcard. GetAtt on a log group does return an arn already ending ':*', but relying
                # on that is a poor trade here: if it were ever not so, the function still runs and
                # simply stops producing logs - and logs are what the retention rule above exists to
                # bound, and what any usage monitoring would read.
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/linn-api-alexa-smart-home-${stage}-alexaSmartHome:*

  # The other half of the binding: the skill holds our ARN, and this holds the skill's id. Without
  # EventSourceToken any Alexa skill in the world could invoke this function.
  AlexaSmartHomeLambdaPermissionAlexaSmartHome1:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AlexaSmartHomeLambdaFunction.Arn
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !Ref alexaSkillId

  # INHERITED FROM THE SERVERLESS DEPLOYMENT, AND DELIBERATELY STILL HERE.
  #
  # Serverless created this bucket inside this stack and filled it with past deployment packages.
  # Dropping it from the template would make CloudFormation try to delete it, and a non-empty bucket
  # CANNOT be deleted - the delete fails and the whole stack update rolls back. So it stays, retained,
  # until someone empties it by hand; removing it from the template after that is then a no-op on the
  # physical bucket precisely because of the retention policies.
  #
  # It is not used: deployment packages go to the bucket in persistence.yml. Condition-guarded so that
  # sys, which has no such inheritance, does not grow one.
  ServerlessDeploymentBucket:
    Type: AWS::S3::Bucket
    Condition: IsInheritedFromServerless
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # WHAT MAKES A FAILURE VISIBLE. Before these, this skill could fail for every customer with nothing at
  # Linn capable of noticing: Alexa converts a backend error into a spoken "your device isn't responding",
  # no HTTP status is exposed to anyone, and the log group expires in 7 days.
  #
  # THE METRIC FILTER IS THE PRIMARY SIGNAL, NOT THE ERRORS ALARM, and that is the opposite of the
  # obvious arrangement. Handler.ts answers every handled failure with callback(null, response) - because
  # a well-formed Alexa ErrorResponse IS the correct answer - so Lambda counts those invocations as
  # SUCCESSES. The Errors metric would read zero while 100% of directives failed. Only the log line
  # distinguishes them.
  #
  # Matched on the message rather than a level: Logger writes every line at "Debug", so the level cannot
  # separate an error from a request. "Response Error Event" is the literal Logger.logError emits.
  errorResponseMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AlexaSmartHomeLogGroup
      FilterPattern: '"Response Error Event"'
      MetricTransformations:
        - MetricName: !Sub AlexaSmartHomeErrorResponses-${environment}
          MetricNamespace: Linn/AlexaSmartHome
          MetricValue: "1"
          # So a quiet period reads as zero rather than as missing data, which is what lets a future
          # alarm on this metric distinguish "no failures" from "no traffic".
          DefaultValue: 0

  # NO ALARM ON THAT METRIC YET, DELIBERATELY. Some rate of INVALID_AUTHORIZATION_CREDENTIAL is normal -
  # tokens expire - and nobody has measured what normal is. A threshold invented here would either cry
  # wolf or, worse, sit above the real failure rate and read as confidence. The filter starts
  # accumulating the metric now so that a threshold can be chosen from a week of data rather than
  # guessed; the alarm is a follow-up once there is a baseline.

  # Errors and Throttles DO get thresholds of one, and the reason is the same fact that demotes them:
  # because handled failures return successfully, an Errors datapoint is never an ordinary failure. It is
  # a crash or - the case that matters - a TIMEOUT, which is the one path that produces no log line at all
  # and so is invisible to the filter above.
  functionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub The Alexa skill function crashed or timed out (${environment})
      AlarmActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      OKActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlexaSmartHomeLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: CIT
          Value: UI
        - Key: Environment
          Value: !Ref environment
        - Key: Project
          Value: linn-api-alexa-smart-home
        - Key: RnDCost
          Value: !If [RndCost, 'true', 'false']

  # There is no reserved concurrency on this function, so a throttle means something else in the shared
  # account consumed the pool. The skill is silent for the customer either way, and this is the only
  # place it would show.
  functionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub The Alexa skill function was throttled (${environment})
      AlarmActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      OKActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlexaSmartHomeLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: CIT
          Value: UI
        - Key: Environment
          Value: !Ref environment
        - Key: Project
          Value: linn-api-alexa-smart-home
        - Key: RnDCost
          Value: !If [RndCost, 'true', 'false']

  # THE ONLY THING THAT CAN SEE THE SKILL GO DARK, and the reason it is needed is specific: if Alexa's
  # invoke permission is ever wrong, Alexa is refused BEFORE the function runs. There is no invocation, no
  # log stream, no Errors datapoint and no metric-filter hit - every other alarm here watches a function
  # that runs and fails, and none of them can see one that is never reached. That failure mode is live
  # today, because this migration recreates the Lambda permission.
  #
  # It also stands in for a manual test that cannot be performed: nobody at Linn has an Alexa account
  # linked, so "ask it to turn something on" is not available. Note a scheduled canary would NOT
  # substitute - a scheduled invoke authenticates with IAM, not as alexa-connectedhome.amazon.com, so it
  # would prove the code works while the skill stayed broken.
  #
  # THE THREE-HOUR WINDOW IS DERIVED, NOT PICKED. 168 consecutive hours of production Invocations were
  # measured before writing this: 98 calls a day, 5 hours with zero calls (3%), and the longest run of
  # consecutive zero hours was ONE. Two in a row never occurred; three has no precedent in the data.
  # Traffic is also flat around the clock - the 01:00-05:00 zero rate was 0/35 - so there is no quiet
  # period for this to fire on, which is what makes absence a usable signal here and would not be true of
  # a typical consumer skill.
  #
  # TreatMissingData: breaching, unlike the two alarms above. For them a missing datapoint means "nothing
  # went wrong"; here it means "nothing arrived", which is the whole event.
  functionSilenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmDescription: The Alexa skill has received no invocations for three hours - Alexa may be unable to invoke it at all
      AlarmActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      OKActions:
        - Fn::ImportValue: !Sub linn-api-infrastructure-${environment}-alert-teams-ui-topic-arn
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlexaSmartHomeLambdaFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      # All three must be zero, so a single quiet hour - which happens about 3% of the time - cannot fire
      # it. A rolling three hours rather than one fixed three-hour bucket, so detection does not depend on
      # where the outage falls in the clock.
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Tags:
        - Key: CIT
          Value: UI
        - Key: Environment
          Value: !Ref environment
        - Key: Project
          Value: linn-api-alexa-smart-home
        - Key: RnDCost
          # The !If IS redundant here and is kept deliberately. cfn-lint reports the 'true' branch as
          # unreachable (W1028) and it is right: this alarm carries Condition: IsProduction, so within it
          # environment is prod and RndCost - defined as "not prod" - cannot be true.
          #
          # It stays because a bare 'false' is a copy-paste trap. Every other RnDCost site in the estate
          # uses this exact !If, so this block is the one a reader would lift into a resource that DOES
          # exist in sys - and there it would tag sys as non-R&D, silently, with cost allocation quietly
          # under-attributing and nothing failing. The redundancy costs a warning from a tool this
          # repository's CI does not run; the constant costs a wrong value nobody would notice.
          #
          # So do not "tidy" this to a constant. If cfn-lint is ever added to this repository's pipeline,
          # suppress W1028 here rather than resolve it.
          Value: !If [RndCost, 'true', 'false']

Outputs:
  FunctionArn:
    Description: The ARN the Alexa skill is configured to invoke. It must not change.
    Value: !GetAtt AlexaSmartHomeLambdaFunction.Arn
  FunctionName:
    Value: !Ref AlexaSmartHomeLambdaFunction
