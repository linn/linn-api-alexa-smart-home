language: node_js
node_js: "22"
dist: noble

# Carried over verbatim from the previous configuration: AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, encrypted with this repository's Travis key. Nothing else supplies them, and
# without them every aws call in scripts/ci.sh fails with NoCredentials AFTER the tests have passed -
# which reads as a broken deploy rather than a missing input.
#
# They cannot be retyped or regenerated here: the ciphertext is bound to this repository's key.
env:
  global:
  - secure: 
  - secure: 
  - secure: 

before_install:
  # IN before_install, AND THAT IS THE WHOLE POINT. This repository declares no `install:` key, so
  # Travis runs its own for `language: node_js` - and that default install happens BEFORE before_script.
  # A gate ordered there would be reporting on a tree whose dependencies had already run their install
  # scripts, on a machine holding this build's credentials, which is the one thing it exists to prevent.
  #
  # The registry login moved up with it rather than being duplicated: the gate image is private, so the
  # gate cannot run before the login, and the login has no reason to be later than the first thing that
  # needs it.
  - set -e
  # The gate image is private, as linn/sbom-tool is; this repository publishes no images and so needed
  # no registry login until it consumed one.
  - '[ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ] || { echo "Docker Hub credentials are not set - the malware gate cannot pull its image" >&2; exit 1; }'
  - printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - ./scripts/malware-gate.sh

before_script:
  - set -e
  - export CI_BUILD_ENV=travis-dist:${TRAVIS_DIST}
  - '[ -n "${TRAVIS_DIST}" ] || { echo "TRAVIS_DIST is not set - cannot record what built the artefact" >&2; exit 1; }'
  # The AWS CLI is not on the Travis image. It is needed here rather than inside a container because
  # the deploy is CloudFormation driven from the VM - the previous deployment ran the Serverless
  # Framework inside a Docker image, which is why nothing installed it before.
  #
  # Extracted to its own directory: the archive contains a top-level aws/ folder, and this repository
  # already has an aws/ holding the CloudFormation templates.
  - curl -sSf "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
  - unzip -q awscliv2.zip -d ./aws-installer
  - sudo ./aws-installer/aws/install
  - rm -rf ./aws-installer awscliv2.zip
  - aws --version

script:
  # One entry point, so what CI does is readable in the repository rather than spread across this
  # file. Deployment is gated inside it on branch and pull-request state - this skill deploys
  # straight to production, so an ungated build is a production deploy from any branch.
  - ./scripts/ci.sh
