# Version updates only. Security updates are switched on in the repository settings, and the cooldown
# does not apply to them. Nothing in this file merges a pull request.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # @types/node tracks the Lambda runtime's Node major (nodejs24.x), not the latest major, which
      # types APIs the runtime lacks. Remove with the move to nodejs26.x: linn/linn-api-development#775
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
